parameters:
    upload_dir.activities: '%kernel.project_dir%/public/uploads/activities'
    upload_dir.activities_documents: '%kernel.project_dir%/public/uploads/activities/documents'
    upload_dir.circuits: '%kernel.project_dir%/public/uploads/circuits'
    upload_dir.circuits_documents: '%kernel.project_dir%/public/uploads/circuits/documents'
    upload_dir.factures: '%kernel.project_dir%/public/uploads/factures'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    resend_api_key: '%env(RESEND_API_KEY)%'
    huggingface_api_key: '%env(HUGGINGFACE_API_KEY)%'
    openai_api_key: '%env(OPENAI_API_KEY)%'
    google_cloud_api_key: '%env(GOOGLE_CLOUD_API_KEY)%'
    openweather_api_key: '%env(OPENWEATHER_API_KEY)%'
    exchange_rate_api_key: '%env(EXCHANGE_RATE_API_KEY)%'
    geoapify_api_key: '%env(GEOAPIFY_API_KEY)%'
    openrouter_api_key: '%env(OPENROUTER_API_KEY)%'
    yelp_api_key: '%env(default::YELP_API_KEY)%'
    opentripmap_api_key: '%env(default::OPENTRIPMAP_API_KEY)%'
    geonames_username: '%env(default::GEONAMES_USERNAME)%'
    unsplash_access_key: '%env(default::UNSPLASH_ACCESS_KEY)%'
    google_search_api_key: ''
    google_search_cx: ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Migrations/'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Service\OpenAIService:
        arguments:
            $openAiApiKey: '%openai_api_key%'

    App\Service\TravelPreparationAssistantService:
        arguments:
            $openAiApiKey: '%openai_api_key%'

    App\Service\OpenRouterService:
        arguments:
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'

    App\Service\HuggingFaceService:
        arguments:
            $huggingfaceApiKey: '%huggingface_api_key%'

    App\Service\WeatherService:
        arguments:
            $openWeatherApiKey: '%openweather_api_key%'

    App\Service\PaymentService:
        arguments:
            $resendApiKey: '%resend_api_key%'
            $projectDir: '%kernel.project_dir%'

    App\Service\GeocodingService:
        arguments:
            $geoapifyApiKey: '%geoapify_api_key%'

    App\Service\TranslationService:
        arguments:
            $deeplApiKey: '%env(DEEPL_API_KEY)%'

    App\Service\ContentModerationService:
        arguments:
            $apiKey: '%openai_api_key%'

    App\Service\Api\YelpService:
        arguments:
            $yelpApiKey: '%yelp_api_key%'

    App\Service\Api\OpenTripMapService:
        arguments:
            $openTripMapApiKey: '%opentripmap_api_key%'

    App\Service\Api\GeoNamesService:
        arguments:
            $geoNamesUsername: '%geonames_username%'

    App\Service\Api\UnsplashService:
        arguments:
            $unsplashAccessKey: '%unsplash_access_key%'

    App\Service\Api\GoogleSearchService:
        arguments: []