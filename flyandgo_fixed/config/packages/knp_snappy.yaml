knp_snappy:
    pdf:
        enabled: true
        binary: "%env(WKHTMLTOPDF_PATH)%"
        options:
            enable-local-file-access: true
            encoding: UTF-8
            images: true
            margin-bottom: 20mm
            margin-left: 20mm
            margin-right: 20mm
            margin-top: 20mm
            page-size: A4
            footer-center: "Page [page] sur [toPage]"
            footer-font-size: 10
    image:
        enabled: true
        binary: "%env(WKHTMLTOIMAGE_PATH)%"
        options:
            format: png
            quality: 90